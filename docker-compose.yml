services:
  medicare-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medicare-followup-agent
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.2:3b
      LOG_LEVEL: INFO
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
