[project]
name = "medicare-followup-agent"
version = "0.1.0"
description = "Production-style healthcare patient follow-up agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.3",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.11",
    "mcp>=2.2.0",
    "pandas",
    "pydantic",
    "pydantic-settings",
    "sentence-transformers>=6.1.0",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "deepeval>=4.2.3",
    "httpx",
    "mypy",
    "pandas-stubs>=3.0.5.260914",
    "pytest",
    "pytest-asyncio",
    "pytest-cov>=7.1.0",
    "ruff",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

