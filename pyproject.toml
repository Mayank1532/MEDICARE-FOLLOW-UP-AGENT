[project]
name = "medicare-followup-agent"
version = "0.1.0"
description = "Production-style healthcare patient follow-up agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "pandas",
    "pydantic",
    "pydantic-settings",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

